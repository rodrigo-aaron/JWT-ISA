<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 24rem);
      padding: 2rem;
      border: 1px solid #e1e6ef;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 2.5rem rgb(23 32 51 / 8%);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.75rem;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.4rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd3e0;
      border-radius: 0.5rem;
      font: inherit;
    }

    input:focus {
      border-color: #315ee8;
      outline: 3px solid rgb(49 94 232 / 18%);
    }

    input[readonly] {
      background: #f3f5f9;
    }

    button {
      margin-top: 0.25rem;
      padding: 0.8rem;
      border: 0;
      border-radius: 0.5rem;
      background: #315ee8;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: #254dcc;
    }

    #login-error {
      min-height: 1.25rem;
      margin: 0;
      color: #b42318;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Log in</h1>
    <label id="team-label" for="team">
      Team PrjD6
    </label>
    <form id="login-form">
      <label for="username">
        Username
        <input id="username" name="username" type="text" autocomplete="username" required>
      </label>
      <label for="password">
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" role="alert" aria-live="polite"></p>
      <button type="submit">Log in</button>
    </form>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "admin" && password === "BCIT12") {
        window.location.href = "admin.html";
        return;
      }

      document.getElementById("login-error").textContent = "Incorrect username or password.";
    });
  </script>
</body>

</html>
