<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f5f9;
      }

      body {
        margin: 0;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 1rem 2rem;
        background: #172033;
      }

      nav a {
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      nav a:hover {
        text-decoration: underline;
      }

      main {
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation">
      <a href="page1.html">page1</a>
      <a href="page2.html">page2</a>
      <a href="index.html">logout</a>
    </nav>
    <main>
      <p>Welcome to team prjD6, Secret "defaultsecret", time: <time id="browser-time"></time>.</p>
    </main>
    <script>
      const browserTime = document.getElementById("browser-time");

      function updateBrowserTime() {
        const now = new Date();
        browserTime.dateTime = now.toISOString();
        browserTime.textContent = now.toLocaleString();
      }

      updateBrowserTime();
      window.setInterval(updateBrowserTime, 1000);
    </script>
  </body>
</html>
